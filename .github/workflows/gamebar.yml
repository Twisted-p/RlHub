name: Build Game Bar overlay
on:
  workflow_dispatch:
  push:
    branches: [codex/standalone-overlay]
    paths: ['gamebar/**/*.cs', 'gamebar/**/*.xaml', 'gamebar/**/*.csproj', 'gamebar/**/*.appxmanifest', 'gamebar/**/*.rd.xml', 'gamebar/Assets/**', '.github/workflows/gamebar.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build widget
        shell: pwsh
        run: msbuild gamebar/RLHubGameBar.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="${{ github.workspace }}\gamebar\packages\" /p:UapAppxPackageBuildMode=SideloadOnly
      - uses: actions/upload-artifact@v4
        with:
          name: RLHub-GameBar
          path: gamebar/packages/
